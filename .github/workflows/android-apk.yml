name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^(e|w): |What went wrong|> " build.log | grep -vE "^> Task" | tail -60

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/player-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: player-apk
          path: android/out/*.apk
          if-no-files-found: error
